name: Diagnostic des champs Centris

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  champs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lister les champs (noms seulement)
        env:
          CENTRIS_API_KEY: ${{ secrets.CENTRIS_API_KEY }}
          CENTRIS_MEMBER_KEY: ${{ secrets.CENTRIS_MEMBER_KEY }}
        run: node scripts/champs.mjs > /tmp/champs.txt 2>&1 || true
      - name: Enregistrer le résultat dans la branche diagnostic
        run: |
          git config user.name "diagnostic"
          git config user.email "diagnostic@users.noreply.github.com"
          git checkout --orphan diagnostic
          git rm -rf --quiet .
          cp /tmp/champs.txt champs.txt
          git add champs.txt
          git commit -m "Résultat du diagnostic"
          git push -f origin diagnostic
