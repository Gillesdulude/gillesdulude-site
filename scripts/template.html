<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITRE}} | {{NOM}}</title>
<meta name="description" content="{{SOUS_TITRE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2430; --muted:#5d6876; --line:#e4e1da; --bg:#faf8f4; --card:#fff;
    --accent:#a5402d; --accent-ink:#fff; --deep:#16202b; --ok:#2f6b4f; --warn:#9a6a12;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:16px/1.55 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  img{display:block;max-width:100%}
  button{font:inherit;cursor:pointer}
  .apercu{background:#fff3cd;color:#5c4400;text-align:center;padding:8px 16px;font-size:14px}

  header.hero{background:var(--deep);color:#f4efe6;padding:56px 24px 64px}
  .wrap{max-width:1180px;margin:0 auto}
  .hero .who{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#c9bfae}
  .hero h1{font:600 clamp(32px,5vw,52px)/1.08 Fraunces,Georgia,serif;margin:10px 0 12px}
  .hero p{max-width:620px;color:#d6cfc3;margin:0}
  .hero .count{margin-top:22px;font-size:14px;color:#c9bfae}

  .bar{position:sticky;top:0;z-index:5;background:rgba(250,248,244,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 24px;flex-wrap:wrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  select{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#fff}

  main .wrap{padding:28px 24px 64px}
  .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;color:inherit;transition:transform .18s,box-shadow .18s}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(22,32,43,.12)}
  .card .ph{aspect-ratio:3/2;background:#e9e4da;position:relative;overflow:hidden}
  .card .ph img{width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;top:12px;left:12px;background:#fff;color:var(--ink);font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px}
  .badge.pending{background:var(--warn);color:#fff}
  .nphotos{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px}
  .card .body{padding:16px 18px 18px}
  .price{font:600 24px/1.2 Fraunces,Georgia,serif}
  .addr{margin-top:4px;font-weight:500}
  .city{color:var(--muted);font-size:14px}
  .facts{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
  .facts b{color:var(--ink);font-weight:600}
  .type{margin-top:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .sec{font-family:inherit;font-size:26px;margin:56px 0 20px;padding-top:32px;border-top:1px solid rgba(0,0,0,.1)}
  .badge.sold{background:#9b2c2c;color:#fff}
  #vgrid .ph img{filter:saturate(.85)}
  .empty{padding:60px 0;text-align:center;color:var(--muted)}

  /* Fiche détaillée */
  dialog{border:0;padding:0;border-radius:18px;width:min(1040px,96vw);max-height:94vh;background:#fff;color:var(--ink)}
  dialog::backdrop{background:rgba(16,22,30,.7)}
  .dlg{display:grid;grid-template-columns:1.35fr 1fr;max-height:94vh}
  .gal{background:#111;position:relative;min-height:320px}
  .gal img{width:100%;height:100%;object-fit:contain;max-height:94vh}
  .gal .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.9);width:42px;height:42px;border-radius:50%;font-size:20px}
  .gal .prev{left:12px}.gal .next{right:12px}
  .gal .idx{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);font-size:13px;padding:3px 10px;border-radius:99px}
  .info{padding:28px;overflow:auto}
  .close{position:absolute;top:12px;right:12px;z-index:2;border:0;background:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .info .price{font-size:30px}
  .specs{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:20px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px}
  .specs div span{display:block;color:var(--muted);font-size:12px}
  .desc{white-space:pre-line;font-size:15px;color:#2d3743}
  .cta{margin-top:22px;background:var(--bg);border-radius:12px;padding:16px}
  .cta strong{display:block}
  .cta a.btn{display:inline-block;margin-top:10px;margin-right:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px}
  .cta a.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .mls{margin-top:14px;font-size:13px;color:var(--muted)}

  footer{background:var(--deep);color:#c9bfae;font-size:14px}
  footer .wrap{padding:32px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer a{color:#f4efe6}

  @media (max-width:820px){
    .dlg{grid-template-columns:1fr;overflow:auto}
    .gal{min-height:0;aspect-ratio:4/3}
    .info{overflow:visible}
  }
</style>
</head>
<body>
{{APERCU}}
<header class="hero">
  <div class="wrap">
    <div class="who">{{NOM}} · {{TITRE_COURTIER}}</div>
    <h1>{{TITRE}}</h1>
    <p>{{SOUS_TITRE}}</p>
    <div class="count" id="count"></div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="Filtrer par type"></div>
    <label><span class="sr" hidden>Trier</span>
      <select id="sort" aria-label="Trier">
        <option value="desc">Prix décroissant</option>
        <option value="asc">Prix croissant</option>
        <option value="new">Plus récentes</option>
      </select>
    </label>
  </div>
</div>

<main><div class="wrap"><div class="grid" id="grid"></div>
  <section id="vendus-sec" hidden>
    <h2 class="sec">Récemment vendues</h2>
    <div class="grid" id="vgrid"></div>
  </section>
</div></main>

<dialog id="dlg" aria-label="Fiche de la propriété"></dialog>

<footer>
  <div class="wrap">
    <div><strong style="color:#f4efe6">{{NOM}}</strong>, {{TITRE_COURTIER}}<br>{{AGENCE}}</div>
    <div id="maj"></div>
  </div>
</footer>

<script id="data" type="application/json">{{DATA}}</script>
<script>
(() => {
  const { listings, vendus = [], courtier, majLe } = JSON.parse(document.getElementById("data").textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const money = (n) => n ? n.toLocaleString("fr-CA", { maximumFractionDigits: 0 }) + " $" : "";
  const priceOf = (l) => l.prix ? money(l.prix) : l.loyer ? money(l.loyer) + " / mois" : "Prix sur demande";
  const kind = (l) => l.sousType || l.type || "Propriété";

  let filter = "Toutes", sort = "desc";

  // Filtres selon les types réellement présents
  const types = ["Toutes", ...new Set(listings.map(kind))];
  const chips = $("#chips");
  if (types.length > 2) {
    chips.innerHTML = types.map(t => `<button class="chip" aria-pressed="${t === filter}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
    chips.addEventListener("click", e => {
      const b = e.target.closest(".chip"); if (!b) return;
      filter = b.dataset.t;
      chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.t === filter));
      draw();
    });
  }
  $("#sort").addEventListener("change", e => { sort = e.target.value; draw(); });

  function facts(l) {
    const f = [];
    if (l.logements) f.push(`<span><b>${l.logements}</b> logements</span>`);
    if (l.chambres) f.push(`<span><b>${l.chambres}</b> ch.</span>`);
    if (l.sallesDeBain) f.push(`<span><b>${l.sallesDeBain}</b> s.d.b.</span>`);
    if (l.superficie) f.push(`<span><b>${esc(l.superficie)}</b></span>`);
    return f.join("");
  }

  const card = (l) => `
      <button class="card" data-id="${esc(l.id)}" aria-label="Voir ${esc(l.adresse)}">
        <div class="ph">
          ${l.photos[0] ? `<img loading="lazy" src="${esc(l.photos[0].url)}" alt="${esc(l.adresse)}">` : ""}
          <span class="badge ${l.vendu ? "sold" : l.statut !== "Active" ? "pending" : ""}">${esc(l.statutTexte)}</span>
          ${l.photos.length > 1 ? `<span class="nphotos">${l.photos.length} photos</span>` : ""}
        </div>
        <div class="body">
          <div class="price">${l.vendu ? "Vendu" : priceOf(l)}</div>
          <div class="addr">${esc(l.adresse)}</div>
          <div class="city">${esc(l.ville)}</div>
          <div class="facts">${facts(l)}</div>
          <div class="type">${esc(kind(l))}</div>
        </div>
      </button>`;

  if (vendus.length) {
    $("#vendus-sec").hidden = false;
    $("#vgrid").innerHTML = vendus.map(card).join("");
  }

  function draw() {
    let rows = listings.filter(l => filter === "Toutes" || kind(l) === filter);
    rows = rows.slice().sort((a, b) =>
      sort === "asc" ? (a.prix || a.loyer || 0) - (b.prix || b.loyer || 0)
      : sort === "new" ? String(b.modifie).localeCompare(String(a.modifie))
      : (b.prix || b.loyer || 0) - (a.prix || a.loyer || 0));
    $("#count").textContent = listings.length
      ? `${listings.length} propriété${listings.length > 1 ? "s" : ""} en ce moment`
      : "";
    $("#grid").innerHTML = rows.length ? rows.map(card).join("")
      : `<div class="empty">Aucune propriété en ce moment. Revenez bientôt, ou contactez-moi pour être avisé des nouveautés.</div>`;
  }

  // Fiche détaillée
  const dlg = $("#dlg");
  let cur = null, pi = 0;
  function open(id) {
    cur = listings.find(l => l.id === id) || vendus.find(l => l.id === id); if (!cur) return;
    pi = 0;
    const spec = (lab, v) => v ? `<div><span>${lab}</span>${esc(v)}</div>` : "";
    const sujet = encodeURIComponent(`Propriété ${cur.adresse}, ${cur.ville} (Centris ${cur.id})`);
    dlg.innerHTML = `
      <button class="close" aria-label="Fermer">×</button>
      <div class="dlg">
        <div class="gal">
          <img id="gimg" alt="">
          ${cur.photos.length > 1 ? `<button class="nav prev" aria-label="Photo précédente">‹</button><button class="nav next" aria-label="Photo suivante">›</button>` : ""}
          <div class="idx" id="gidx"></div>
        </div>
        <div class="info">
          <div class="type" style="margin-top:0">${esc(kind(cur))} · ${esc(cur.statutTexte)}</div>
          <div class="price" style="margin-top:6px">${cur.vendu ? "Vendu" : priceOf(cur)}</div>
          <div class="addr">${esc(cur.adresse)}</div>
          <div class="city">${esc([cur.ville, cur.codePostal].filter(Boolean).join(", "))}</div>
          <div class="specs">
            ${spec("Logements", cur.logements)}
            ${spec("Chambres", cur.chambres)}
            ${spec("Salles de bain", cur.sallesDeBain)}
            ${spec("Salles d'eau", cur.sallesEau)}
            ${spec("Superficie habitable", cur.superficie)}
            ${spec("Terrain", cur.terrain)}
            ${spec("Année de construction", cur.anneeConstruction)}
          </div>
          <div class="desc">${esc(cur.description)}</div>
          <div class="cta">
            <strong>${cur.vendu ? "Vous songez à vendre ? Parlons de la valeur de votre propriété." : "Intéressé par cette propriété ?"}</strong>
            ${esc(courtier.nom)}, ${esc(courtier.titre)}
            <div>
              ${courtier.courriel ? `<a class="btn" href="mailto:${esc(courtier.courriel)}?subject=${cur.vendu ? encodeURIComponent("Évaluation de ma propriété") : sujet}">${cur.vendu ? "Évaluer ma propriété" : "Demander une visite"}</a>` : ""}
              ${courtier.telephone ? `<a class="btn alt" href="tel:${esc(courtier.telephone.replace(/[^0-9+]/g, ""))}">${esc(courtier.telephone)}</a>` : ""}
              ${cur.visiteVirtuelle ? `<a class="btn alt" target="_blank" rel="noopener" href="${esc(cur.visiteVirtuelle)}">Visite virtuelle</a>` : ""}
            </div>
          </div>
          <div class="mls">No Centris ${esc(cur.id)}</div>
        </div>
      </div>`;
    showPhoto();
    dlg.querySelector(".close").onclick = () => dlg.close();
    dlg.querySelector(".prev")?.addEventListener("click", () => step(-1));
    dlg.querySelector(".next")?.addEventListener("click", () => step(1));
    if (!dlg.open) dlg.showModal();
    history.replaceState(null, "", "#" + encodeURIComponent(cur.id));
  }
  function showPhoto() {
    const p = cur.photos[pi]; const img = $("#gimg");
    if (p) { img.src = p.url; img.alt = p.legende || cur.adresse; }
    $("#gidx").textContent = cur.photos.length ? `${pi + 1} / ${cur.photos.length}` : "";
  }
  function step(d) { if (!cur.photos.length) return; pi = (pi + d + cur.photos.length) % cur.photos.length; showPhoto(); }

  $("main").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) open(c.dataset.id); });
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("close", () => history.replaceState(null, "", location.pathname + location.search));
  document.addEventListener("keydown", e => { if (!dlg.open) return; if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); });

  const d = new Date(majLe);
  $("#maj").textContent = "Mise à jour : " + d.toLocaleDateString("fr-CA", { day: "numeric", month: "long", year: "numeric" }) + " à " + d.toLocaleTimeString("fr-CA", { hour: "2-digit", minute: "2-digit" });

  draw();
  if (location.hash.length > 1) open(decodeURIComponent(location.hash.slice(1)));
})();
</script>
</body>
</html>
